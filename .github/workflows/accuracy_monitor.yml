name: Accuracy Monitor

on:
  schedule:
    # A los 5 min de cada hora: deja que Hourly Data Collector (minuto 0)
    # traiga primero las observaciones reales contra las que se compara.
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  score-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Evaluar predicciones vencidas y calcular accuracy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/accuracy_monitor.py
