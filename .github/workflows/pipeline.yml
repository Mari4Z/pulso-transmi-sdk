name: pulso-transmi-pipeline

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "Qué disparó este reentrenamiento (manual, drift, ...)"
        required: false
        default: manual
  # Activa el schedule únicamente cuando el profesor publique la frecuencia.
  # schedule:
  #   - cron: "7 * * * *"

concurrency:
  group: pulso-transmi-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Reentrenar y versionar modelo
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETRAIN_TRIGGER: ${{ inputs.trigger || 'manual' }}
        run: python -m src.pipeline

      - name: Publicar modelo si cambió
        run: |
          git config user.name "pulso-transmi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add models/pulso_hgb_poisson.joblib models/pulso_hgb_poisson.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el modelo, nada que publicar."
          else
            git commit -m "chore: retrain model (trigger: ${{ inputs.trigger || 'manual' }})"
            git push
          fi
