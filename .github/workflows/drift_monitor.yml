name: Drift Monitor

on:
  schedule:
    # Cada hora (antes cada 6h): con 6h de por medio, un drift severo podía
    # seguir empeorando bastante entre un reentrenamiento y el siguiente
    # chequeo — ver docs/experimentos-modelos.md, exp-20260929-shock-blend.
    - cron: "23 * * * *"
  workflow_dispatch:

jobs:
  check-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Ejecutar Monitoreo de Drift
        id: drift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
        run: python src/drift_monitor.py

      # El umbral que decide "severo" vive en src/drift_monitor.py
      # (SEVERE_MEAN_CHANGE_PCT), no aquí.
      - name: Disparar reentrenamiento por drift severo
        if: steps.drift.outputs.severe_drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml --ref ${{ github.ref_name }} -f trigger=drift
