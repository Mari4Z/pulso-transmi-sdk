name: Drift Monitor

on:
  schedule:
    # Cada 30 min (antes cada hora, antes cada 6h): el profesor anunció un
    # drift más fuerte que el anterior — probamos acortar la ventana de
    # detección de 24h a 6h para reaccionar más rápido y empeoró (ver
    # exp-20260930-*, docs/experimentos-modelos.md: más ruido, falsos
    # positivos en estaciones tranquilas). Revisar con más frecuencia sí
    # ayuda sin ese costo: mismo umbral, mismo cálculo, solo se entera antes.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Ejecutar Monitoreo de Drift
        id: drift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
        run: python src/drift_monitor.py

      # El umbral que decide "severo" vive en src/drift_monitor.py
      # (SEVERE_MEAN_CHANGE_PCT), no aquí.
      # Pausado a petición: el drift sigue midiéndose, pero no dispara reentrenamientos.
      # Para reactivar, quitar el `if: false` de este paso.
      - name: Disparar reentrenamiento por drift severo (pausado)
        if: false && steps.drift.outputs.severe_drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml --ref ${{ github.ref_name }} -f trigger=drift
