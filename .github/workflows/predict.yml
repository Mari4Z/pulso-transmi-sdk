name: pulso-transmi-predict

on:
  # Primary trigger: cron-job.org calls the workflow_dispatch API every 10
  # minutes (GitHub's own `schedule` is unreliable at sub-hourly frequency).
  workflow_dispatch:
  schedule:
    # Hourly safety net in case the external cron-job.org trigger fails.
    - cron: "17 * * * *"

concurrency:
  group: pulso-transmi-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev,ml]"

      - name: Run tests
        run: python -m pytest -q

      - name: Synchronize, predict and submit
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pulso_transmi.pipeline

      - name: Upload submission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-receipt-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
