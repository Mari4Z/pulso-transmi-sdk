name: Hourly Data Collector

on:
  schedule:
    # Se ejecuta en el minuto 0 de cada hora (Ej: 1:00, 2:00, etc.)
    - cron: '0 * * * *'
  # Permite ejecutar el flujo de trabajo manualmente desde la pestaña de Actions
  workflow_dispatch:

jobs:
  collect-and-insert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Ejecutar colector (API -> Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: |
          python src/collector.py

